name: backend

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]

# A throwaway Postgres per run. Never point this at Neon.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_CONNECTION_STRING: postgresql://sentinel:sentinel@localhost:5432/sentinel_ci
      ENVIRONMENT: test
      PYTHONPATH: .
      # No model, no Composio, no HydraDB: the suites cover the keyless paths and
      # skip what needs a live model.
      QWEN_API_KEY: ""
      COMPOSIO_API_KEY: ""
      RUN_SCHEDULER: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Syntax and undefined names
        run: pip install ruff && ruff check --select E9,F63,F7,F82 app scripts
      - name: Migrations apply from scratch
        run: alembic upgrade head
      - name: Migrations round-trip
        run: alembic downgrade base && alembic upgrade head
      - name: Models match migrations
        run: |
          python - <<'PY'
          from alembic.autogenerate import compare_metadata
          from alembic.migration import MigrationContext
          from app.database import engine
          import app.models as m
          with engine.connect() as c:
              drift = compare_metadata(MigrationContext.configure(c), m.Base.metadata)
          assert not drift, drift
          print("no drift")
          PY
      - run: python scripts/verify.py
      - run: python scripts/verify_rbac.py
      - run: python scripts/verify_outbound.py
      - run: python scripts/verify_graph.py
      - run: python scripts/verify_connectors.py
